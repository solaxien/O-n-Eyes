name: P3 regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: browser
      - name: Fetch and verify the on-device verifier model
        run: |
          mkdir -p .models/verifier
          curl -fsSL -o .models/verifier/verifier-yolox-nano.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  .models/verifier/verifier-yolox-nano.onnx" | sha256sum -c
      - run: npm test && npm run build
        working-directory: browser
        env:
          P3_VERIFIER_MODEL: ${{ github.workspace }}/.models/verifier/verifier-yolox-nano.onnx
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-eval.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q p3
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.device -t p3-device .
